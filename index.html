<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GaZacktic Seanquest</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        --cy: #39c5ff;
        --or: #ffb648;
        --bg: rgba(3, 12, 28, 0.84);
        --line: rgba(57, 197, 255, 0.42);
        --txt: #cfeaff;
        --dim: #7fa3bd;
      }
      * {
        box-sizing: border-box;
        scrollbar-width: thin;
        scrollbar-color: rgba(57, 197, 255, 0.42) transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--txt);
        font:
          13px/1.35 "Eurostile",
          "Bank Gothic",
          "Agency FB",
          "Segoe UI",
          system-ui,
          sans-serif;
        letter-spacing: 0.05em;
      }
      #c {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .lbl {
        position: absolute;
        left: 0;
        top: 0;
        text-align: center;
        white-space: nowrap;
        text-transform: uppercase;
        font-size: 11px;
        text-shadow:
          0 0 5px #000,
          0 0 2px #000,
          0 0 9px #000;
        will-change: transform;
      }
      .lbl .nm {
        font-weight: 600;
        letter-spacing: 0.12em;
      }
      .lbl .pips {
        display: flex;
        gap: 3px;
        justify-content: center;
        margin-top: 2px;
      }
      .lbl .pips i {
        width: 9px;
        height: 5px;
        background: #52626f;
        border: 1px solid rgba(255, 255, 255, 0.35);
      }
      .lbl.lane {
        font-size: 10px;
        color: #001018;
        background: var(--cy);
        padding: 0 5px;
        border-radius: 8px;
        text-shadow: none;
        font-weight: 700;
      }
      .lbl.sp {
        color: var(--dim);
        font-size: 10px;
      }

      .panel {
        position: fixed;
        background: var(--bg);
        border: 1px solid var(--line);
        backdrop-filter: blur(3px);
        box-shadow:
          0 0 18px rgba(57, 197, 255, 0.12),
          inset 0 0 30px rgba(57, 197, 255, 0.05);
      }
      #top {
        top: 0;
        left: 0;
        right: 0;
        height: 46px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 14px;
        border-width: 0 0 1px;
      }
      #top h1 {
        margin: 0;
        font-size: 17px;
        letter-spacing: 0.28em;
        color: var(--or);
        text-shadow: 0 0 10px rgba(255, 182, 72, 0.5);
        font-weight: 600;
      }
      #turn {
        flex: 1;
        text-align: center;
        text-transform: uppercase;
        font-size: 13px;
      }
      #turn b {
        color: var(--or);
      }
      #turn .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin: 0 6px -1px 10px;
      }
      #left {
        top: 56px;
        left: 10px;
        width: 262px;
        max-height: calc(100% - 66px);
        overflow: auto;
        padding: 10px;
      }
      #right {
        top: 56px;
        right: 10px;
        width: 344px;
        max-height: calc(100% - 66px);
        overflow: auto;
        padding: 10px;
      }
      #log {
        bottom: 0;
        left: 282px;
        right: 364px;
        height: 28px;
        overflow: hidden;
        border-bottom: 0;
        font-size: 11px;
        color: var(--dim);
        transition: height 0.25s ease;
      }
      #log.open {
        height: 240px;
      }
      #logTab {
        height: 28px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        cursor: pointer;
        color: var(--or);
        text-transform: uppercase;
        letter-spacing: 0.2em;
      }
      #logTab:hover {
        background: rgba(57, 197, 255, 0.12);
      }
      #logTab .last {
        flex: 1;
        color: var(--txt);
        text-transform: none;
        letter-spacing: 0.04em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #logBody {
        height: calc(100% - 28px);
        overflow: auto;
        padding: 4px 10px 8px;
        border-top: 1px solid var(--line);
      }
      #logBody div:first-child {
        color: var(--txt);
      }
      h2 {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.22em;
        color: var(--or);
        text-transform: uppercase;
        border-bottom: 1px solid var(--line);
        padding-bottom: 4px;
        font-weight: 600;
      }
      section {
        margin-bottom: 14px;
      }
      .btn,
      .chip {
        background: rgba(57, 197, 255, 0.09);
        border: 1px solid var(--line);
        color: var(--txt);
        padding: 4px 8px;
        font: inherit;
        font-size: 11px;
        text-transform: uppercase;
        cursor: pointer;
        letter-spacing: 0.08em;
      }
      .btn:hover,
      .chip:hover {
        background: rgba(57, 197, 255, 0.28);
        border-color: var(--cy);
      }
      .btn.on {
        background: var(--or);
        color: #120a00;
        border-color: var(--or);
      }
      .btn.warn {
        border-color: #ff6a5a;
        color: #ffb0a6;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .chip {
        padding: 1px 0;
        width: 22px;
        text-align: center;
      }
      .chip.on {
        background: var(--pc, #52626f);
        color: #000;
        border-color: #fff;
        font-weight: 700;
      }
      .chip.b.on {
        color: #000;
      }
      .chip.b {
        width: auto;
        padding: 1px 5px;
        border-color: var(--pc);
        color: var(--pc);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 5px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 5px 0;
      }
      .row label {
        flex: 0 0 78px;
        color: var(--dim);
        text-transform: uppercase;
        font-size: 10px;
      }
      .row > input,
      .row > select {
        flex: 1;
        min-width: 0;
      }
      input,
      select {
        background: rgba(0, 10, 24, 0.8);
        border: 1px solid var(--line);
        color: var(--txt);
        padding: 3px 5px;
        font: inherit;
        font-size: 12px;
      }
      input[type="color"] {
        padding: 0;
        height: 22px;
        flex: 0 0 34px;
      }
      input[type="checkbox"] {
        flex: 0 0 auto;
      }
      input:disabled,
      select:disabled {
        opacity: 0.55;
      }
      .map {
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 4px 0;
      }
      .map .mn {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .map input.mn {
        flex: 1;
      }
      .pl {
        border: 1px solid var(--line);
        padding: 8px;
        margin-bottom: 10px;
        border-left: 4px solid var(--pc);
      }
      .pl.cur {
        box-shadow: 0 0 14px var(--pc);
        background: rgba(57, 197, 255, 0.06);
      }
      .pl .hd {
        display: flex;
        align-items: baseline;
        gap: 6px;
        text-transform: uppercase;
      }
      .pl .hd {
        cursor: pointer;
      }
      .pl .hd > span:not(.rt) {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pl .hd {
        white-space: nowrap;
      }
      .pl .hd .rt {
        flex: none;
        margin-left: auto;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .pl .hd .rt .tag {
        margin-left: 0;
      }
      .pl .hd .mini {
        color: var(--or);
        font-size: 14px;
      }
      .pl .hd .chev {
        color: var(--dim);
        font-size: 10px;
      }
      .pl:not(.min) .hd {
        margin-bottom: 4px;
      }
      .pl:not(.min) .mini,
      .pl.min .bd {
        display: none;
      }
      .pl.min {
        padding-top: 5px;
        padding-bottom: 5px;
      }
      .pl .hd b {
        font-size: 15px;
        color: var(--pc);
        letter-spacing: 0.14em;
      }
      .pl .cr {
        font-size: 24px;
        color: var(--or);
        margin: 4px 0;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pl .cr input {
        width: 92px;
        font-size: 20px;
        color: var(--or);
        text-align: right;
        appearance: textfield;
        -moz-appearance: textfield;
      }
      .pl .cr input::-webkit-outer-spin-button,
      .pl .cr input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .pl .st {
        color: var(--dim);
        font-size: 11px;
        margin-bottom: 6px;
        text-transform: uppercase;
      }
      .tag {
        font-size: 10px;
        background: var(--or);
        color: #000;
        padding: 0 5px;
        margin-left: auto;
      }
      .hint {
        color: var(--dim);
        font-size: 11px;
        margin-top: 6px;
        min-height: 30px;
      }
      .fl {
        display: flex;
        gap: 4px;
        align-items: center;
        margin: 3px 0;
      }
      .fl .btn {
        flex: 1;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fl .btn.warn {
        flex: 0 0 auto;
      }
      details summary {
        cursor: pointer;
        color: var(--or);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 12px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 4px;
        margin-bottom: 8px;
      }
      body.play .edit-only {
        display: none !important;
      }
      #toast {
        position: fixed;
        left: 50%;
        top: 64px;
        transform: translateX(-50%);
        background: var(--or);
        color: #000;
        padding: 6px 16px;
        font-weight: 700;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.25s;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
      #modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 4, 12, 0.66);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
      #modal.show {
        display: flex;
      }
      #modalBox {
        position: relative;
        width: 440px;
        max-width: 92vw;
        padding: 18px;
      }
      #modalBox .mtext {
        font-size: 15px;
        margin: 4px 0 16px;
      }
      #modalBox .mlabel {
        color: var(--dim);
        text-transform: uppercase;
        font-size: 10px;
        margin: 12px 0 5px;
      }
      #modalBox .btn {
        padding: 8px;
      }
      #modalBox .go {
        margin-top: 16px;
      }
      #modalBox.wide {
        width: 560px;
      }
      #modalBox ol {
        margin: 6px 0 0;
        padding-left: 20px;
        color: var(--txt);
        font-size: 12px;
      }
      #modalBox ol li {
        margin: 3px 0;
      }
      #modalBox .code {
        font-family: Consolas, "Courier New", monospace;
        color: var(--or);
        font-size: 15px;
        letter-spacing: 0.08em;
      }
      .map2 {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 0 8px 0;
        color: var(--dim);
        font-size: 10px;
        text-transform: uppercase;
      }
      .map2 input {
        width: 70px;
      }
      #err {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: #a00;
        color: #fff;
        padding: 6px 12px;
        z-index: 99;
        font-family: monospace;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line);
      }
    </style>
  </head>
  <body class="play">
    <canvas id="c"></canvas>
    <div id="labels"></div>

    <header id="top" class="panel">
      <h1>GAZACKTIC SEANQUEST</h1>
      <div id="turn"></div>
      <button
        class="btn"
        id="netBtn"
        data-act="online"
        title="Play this board with the other commander over the internet"
      >
        Play online
      </button>
      <button class="btn on" id="battleBtn" data-act="battleshow" title="Reopen the battle card" hidden>
        Battle
      </button>
      <button class="btn" data-act="newgame" title="Open the new-game menu">New game</button>
      <button class="btn" data-act="endturn" title="Pay income to the current player and pass the turn">
        End turn
      </button>
      <button class="btn" data-act="undo" title="Ctrl+Z">Undo</button>
      <button class="btn on" id="modeBtn" data-act="mode" title="Edit mode shows the board-building tools">
        Edit mode
      </button>
    </header>

    <aside id="left" class="panel">
      <h2>Commanders</h2>
      <div id="players"></div>
    </aside>

    <aside id="right" class="panel">
      <section class="edit-only">
        <h2>Board tools</h2>
        <div class="grid3" id="tools">
          <button class="btn" data-act="tool:select">Select</button>
          <button class="btn" data-act="tool:move">Move</button>
          <button class="btn" data-act="tool:delete">Delete</button>
          <button class="btn" data-act="tool:planet">+ Planet</button>
          <button class="btn" data-act="tool:space">+ Space</button>
          <button class="btn" data-act="tool:lane">+ Lane</button>
        </div>
        <div class="hint" id="hint"></div>
      </section>
      <section>
        <h2>Selection</h2>
        <div id="sel"></div>
      </section>
      <details>
        <summary>Rules</summary>
        <div id="rules"></div>
      </details>
      <details style="margin-top: 12px">
        <summary>Board data</summary>
        <div class="grid">
          <button class="btn" data-act="export" title="Download the whole game as a JSON file">Export</button>
          <button class="btn" data-act="import" title="Load a JSON file exported from here">Import</button>
          <button
            class="btn warn"
            data-act="newgame"
            title="Keep the board; clear ownership, fleets, credits and turn"
          >
            New game
          </button>
          <button
            class="btn warn"
            data-act="reset"
            title="Throw away everything and restore the default board"
          >
            Reset board
          </button>
        </div>
        <div class="hint">Saved automatically in this browser. Export a file to share the board.</div>
        <div class="hint" id="missionInfo"></div>
        <input type="file" id="file" accept=".json,application/json" hidden />
      </details>
    </aside>

    <div id="log" class="panel">
      <div id="logTab" data-act="logtoggle" title="Pull the log up or down">
        <span>Log</span><span class="last"></span><span class="arrow">▲</span>
      </div>
      <div id="logBody"></div>
    </div>
    <datalist id="codes"></datalist>
    <div id="toast"></div>
    <div id="modal"><div id="modalBox" class="panel"></div></div>
    <div id="err"></div>

    <script src="three.js"></script>
    <script src="peerjs.min.js"></script>
    <script>
      "use strict";
      window.addEventListener("error", (e) => {
        const b = document.getElementById("err");
        b.textContent = "Error: " + e.message + " (line " + e.lineno + ")";
        b.style.display = "block";
      });

      // ───────────────────────────── state ─────────────────────────────
      const KEY = "gazacktic-seanquest.v1";
      const $ = (id) => document.getElementById(id);
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      const uid = (p) => p + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);

      const RULES = [
        ["incomePerMap", "Income / map", 50],
        ["capitalBonus", "Capital bonus", 50],
        ["battleWin", "Battle: winner", 300],
        ["battleLoss", "Battle: loser", 100],
        ["fleetBase", "2nd fleet (doubles)", 500],
        ["hero", "Bonus: Leader (hero)", 400],
        ["moveBase", "1st move pt (doubles)", 100],
        ["factionPick", "Faction pick", 300],
        ["lastStand", "Last stand", 300],
        ["startCredits", "Starting credits", 100],
        ["b_energy", "Bonus: Energy Boost", 100],
        ["b_supplies", "Bonus: Supplies", 100],
        ["b_garrison", "Bonus: Garrison", 100],
        ["b_bacta", "Bonus: Bacta Tanks", 200],
        ["b_turrets", "Bonus: Auto Turrets", 200],
        ["b_shielding", "Bonus: Combat Shielding", 300],
        ["b_blasters", "Bonus: Enhanced Blasters", 300],
        ["b_sabotage", "Bonus: Sabotage", 300],
      ];

      // The Galactic Conquest bonuses: key, name, what it does, and whether it works in space battles.
      // The name is exactly what the game's Fake Console calls it ("Bonus 1 <name>" / "Bonus 2 <name>").
      // Default prices are the stock game's halved, matching the house price of 400 for a hero (stock 800).
      const BONUSES = [
        ["energy", "Energy Boost", "Your units' energy recharges faster.", false],
        ["supplies", "Supplies", "Your units carry extra ammunition.", false],
        ["garrison", "Garrison", "Extra reinforcements for your side.", false],
        ["bacta", "Bacta Tanks", "Your units slowly regain health.", true],
        ["turrets", "Auto Turrets", "Automatic turrets defend your positions.", true],
        ["shielding", "Combat Shielding", "Your units have more health.", true],
        ["blasters", "Enhanced Blasters", "Your blasters do more damage.", false],
        ["sabotage", "Sabotage", "Enemy vehicles start damaged.", true],
        ["leader", "Leader", "Unlocks your side's hero.", false],
      ];
      const bonusCost = (key) => (key === "leader" ? state.rules.hero : state.rules["b_" + key]);
      const bonusesHeld = (p) => BONUSES.reduce((t, b) => t + (p.bonuses[b[0]] || 0), 0);

      // Which faction each commander plays depends on the era of the battle.
      const FACTIONS = { c: ["Republic", "CIS"], g: ["Rebels", "Empire"] };
      const ERA_NAMES = { c: "Clone Wars", g: "Galactic Civil War" };
      const sideOf = (pi, era) => FACTIONS[era][state.sides[era] === pi ? 0 : 1];
      // The game names each battle with a mission code: map + era letter + mode, e.g. cor1c_con.
      // These are the stock maps' codes; maps added by mods need theirs typed in (edit mode).
      const STOCK_CODES = {
        "coruscant|jedi temple": ["cor1", "cg"],
        "dagobah|swamp": ["dag1", "cg"],
        "death star|interior": ["dea1", "cg"],
        "endor|bunker": ["end1", "g"],
        "felucia|marshland": ["fel1", "cg"],
        "geonosis|dust plains": ["geo1", "c"],
        "hoth|echo base": ["hot1", "g"],
        "kamino|cloning facility": ["kam1", "cg"],
        "kashyyyk|beachhead": ["kas2", "cg"],
        "mustafar|refinery": ["mus1", "cg"],
        "mygeeto|war-torn city": ["myg1", "cg"],
        "naboo|theed": ["nab2", "cg"],
        "polis massa|medical facility": ["pol1", "cg"],
        "tantive iv|interior": ["tan1", "cg"],
        "tatooine|jabba's palace": ["tat3", "cg"],
        "tatooine|mos eisley": ["tat2", "cg"],
        "utapau|sinkhole": ["uta1", "cg"],
        "yavin 4|temple": ["yav1", "cg"],
      };
      const MODES = [
        ["con", "Conquest"],
        ["ctf", "Capture the flag"],
        ["1flag", "1-flag CTF"],
        ["hunt", "Hunt"],
        ["eli", "Hero assault"],
      ];
      const SPACE_MAPS = [
        ["spa1", "g", "Space Yavin"],
        ["spa8", "g", "Space Hoth"],
        ["spa9", "g", "Space Tatooine"],
        ["spa3", "c", "Space Kashyyyk"],
        ["spa6", "c", "Space Felucia"],
        ["spa7", "c", "Space Mygeeto"],
      ];
      // The mission list of a real game install, loaded from the mod installer's scan
      // (install-launcher.bat -ScanMissions). It says which map codes exist and which eras and modes each
      // one really has:  state.missions = { cor1: { c: ["con", "ctf"], g: ["con", "ctf"] }, ... }
      // Until one is loaded the board offers every mode and cannot tell a real mission from a wrong one.
      const MISSIONS_KEY = "gazacktic-seanquest.missions";
      function cleanMissions(obj) {
        const out = {};
        if (obj && typeof obj === "object")
          for (const code of Object.keys(obj)) {
            if (!/^[a-z0-9]{2,8}$/.test(code)) continue;
            const eras = {};
            for (const e of ["c", "g"]) {
              const modes = Array.isArray(obj[code][e])
                ? obj[code][e].filter((x) => /^[a-z0-9]{1,8}$/.test(x))
                : [];
              if (modes.length) eras[e] = modes;
            }
            if (Object.keys(eras).length) out[code] = eras;
          }
        return Object.keys(out).length ? out : null;
      }
      // The installer hands the list over in the page address as  cor1:c.con.ctf,g.con;tat2:c.con...
      function parseMissionList(text) {
        const obj = {};
        for (const part of String(text).toLowerCase().split(";")) {
          const m = /^([a-z0-9]{2,8}):(.+)$/.exec(part.trim());
          if (!m) continue;
          obj[m[1]] = {};
          for (const e of m[2].split(",")) {
            const bits = e.split(".");
            if (bits.length > 1) obj[m[1]][bits[0]] = bits.slice(1);
          }
        }
        return cleanMissions(obj);
      }
      const catalogOf = (code) => (state.missions && code ? state.missions[code] || null : null);
      // "ok", "missing", or "" when no mission list is loaded so nothing can be said.
      function missionStatus(mission) {
        if (!state.missions || !mission) return "";
        const m = /^(.+)([cg])_([a-z0-9]+)$/.exec(mission),
          cat = m && state.missions[m[1]];
        return cat && cat[m[2]] && cat[m[2]].includes(m[3]) ? "ok" : "missing";
      }
      // Space maps for an era: from the mission list when there is one, else the stock ones.
      function spaceMapsFor(era) {
        const stock = SPACE_MAPS.filter((s) => s[1] === era).map((s) => [s[0], s[2]]);
        if (!state.missions) return stock;
        const real = Object.keys(state.missions)
          .filter((code) => (state.missions[code][era] || []).includes("ass"))
          .sort()
          .map((code) => [code, (SPACE_MAPS.find((s) => s[0] === code) || [0, 0, "Space map " + code])[2]]);
        return real.length ? real : stock;
      }

      // Give a map its mission code and eras if it has none yet (new boards and older saved games).
      function fillMapCode(planetName, m) {
        if (typeof m.code !== "string") {
          const hit = STOCK_CODES[(planetName + "|" + m.name).toLowerCase()];
          m.code = hit ? hit[0] : "";
          m.eras = hit ? hit[1] : "cg";
        }
        m.code = m.code
          .toLowerCase()
          .replace(/[^a-z0-9]/g, "")
          .slice(0, 8);
        if (!["cg", "c", "g"].includes(m.eras)) m.eras = "cg";
      }

      function defaultState() {
        const P = (id, name, type, size, x, z, maps, extra) =>
          Object.assign(
            {
              id,
              kind: "planet",
              name,
              type,
              size,
              x,
              z,
              ring: false,
              capital: false,
              maps: maps.map((m) => {
                const map = { name: m, owner: -1 };
                fillMapCode(name, map);
                return map;
              }),
            },
            extra,
          );
        const S = (id, x, z) => ({ id, kind: "space", name: "Open space", x, z });
        const lanes = [
          ["p10", "p7"],
          ["p10", "p9"],
          ["p9", "s3"],
          ["s3", "p8"],
          ["p7", "p4"],
          ["p7", "p6"],
          ["p7", "s1"],
          ["s1", "p3"],
          ["p4", "p3"],
          ["p3", "p2"],
          ["p2", "s2"],
          ["s2", "p1"],
          ["p4", "p5"],
          ["p4", "p6"],
          ["p5", "p1"],
          ["p6", "p8"],
          ["p8", "s4"],
          ["s4", "s5"],
          ["s5", "p1"],
        ];
        return {
          v: 1,
          turn: 1,
          current: 0,
          ply: 0,
          era: null,
          phase: "play",
          sides: { c: 0, g: 0 }, // which commander plays the first-listed faction in each era
          battle: null, // the battle being set up or fought: { node, map, era, mode, space, hero }
          players: [
            {
              name: "Zack",
              faction: "Republic",
              color: "#3aa0ff",
              credits: 100,
              movesBought: 0,
              lastStandAt: null,
              bonuses: Object.fromEntries(BONUSES.map((b) => [b[0], 0])),
            },
            {
              name: "Sean",
              faction: "CIS",
              color: "#ff4a3a",
              credits: 100,
              movesBought: 0,
              lastStandAt: null,
              bonuses: Object.fromEntries(BONUSES.map((b) => [b[0], 0])),
            },
          ],
          rules: Object.fromEntries(RULES.map((r) => [r[0], r[2]])),
          nodes: [
            P("p1", "Kashyyyk", "jungle", 0.8, 8.2, 3.4, ["Beachhead", "Docks", "Islands"]),
            P("p2", "Coruscant", "city", 0.85, 7.6, -2.0, ["Jedi Temple"]),
            P("p3", "Rhen Var", "ice", 0.7, 7.2, -6.0, ["Citadel", "Harbor"]),
            P("p4", "Polis Massa", "rock", 0.5, 3.4, -2.7, ["Medical Facility"]),
            P("p5", "Tantive IV", "station", 0.45, 3.2, 1.1, ["Interior"]),
            P("p6", "Kamino", "ocean", 0.75, -1.6, 1.8, ["Cloning Facility"]),
            P("p7", "Tatooine", "desert", 0.8, -1.4, -2.6, ["Jabba's Palace", "Mos Eisley", "Dune Sea"]),
            P("p8", "Death Star", "deathstar", 0.75, -8.0, 5.6, ["Interior"]),
            P("p9", "Mustafar", "lava", 0.65, -7.4, -0.3, ["Refinery"]),
            P("p10", "Geonosis", "dust", 0.75, -6.9, -4.8, ["Dust Plains", "Spire"], { ring: true }),
            S("s1", 2.9, -5.1),
            S("s2", 7.6, 0.8),
            S("s3", -7.8, 2.4),
            S("s4", -2.2, 4.5),
            S("s5", 2.4, 3.8),

          lanes: lanes.map((l, i) => ({ id: "l" + (i + 1), a: l[0], b: l[1], value: 1 })),

      function normalize(s) {
        const d = defaultState();
        if (!s || !Array.isArray(s.nodes) || !Array.isArray(s.lanes))
          throw new Error("not a Seanquest board file");
        s.players = Array.isArray(s.players) && s.players.length === 2 ? s.players : d.players;
        s.players.forEach((p, i) => {
          p.name = String(p.name || d.players[i].name);
          p.faction = String(p.faction || "");
          if (!/^#[0-9a-f]{6}$/i.test(p.color)) p.color = d.players[i].color;
          p.credits = Math.max(0, +p.credits || 0);
          // bonuses bought and not yet used in a battle, by key (older saves kept heroes separately)
          const had = p.bonuses || {};
          if (p.heroes) had.leader = (had.leader || 0) + p.heroes;
          delete p.heroes;
          p.bonuses = {};
          BONUSES.forEach((b) => (p.bonuses[b[0]] = Math.max(0, Math.floor(+had[b[0]] || 0))));

          if (p.lastStandAt === undefined) p.lastStandAt = null;
        });
        s.rules = Object.assign(d.rules, s.rules || {});
        for (const k in s.rules) s.rules[k] = Math.max(0, +s.rules[k] || 0);
        s.nodes.forEach((n) => {
          n.x = +n.x || 0;
          n.z = +n.z || 0;
          n.name = String(n.name || "");
          if (n.kind !== "space") {
            n.kind = "planet";
            n.size = clamp(+n.size || 0.7, 0.3, 1.5);
            n.maps = Array.isArray(n.maps) ? n.maps : [];
            n.maps.forEach((m) => {

        s.log = Array.isArray(s.log) ? s.log.map(String) : [];
        s.turn = +s.turn || 1;
        s.current = s.current === 1 ? 1 : 0;
        s.ply = +s.ply || 0;
        s.phase = s.phase === "draft" ? "draft" : "play";
        s.sides = { c: s.sides && s.sides.c === 1 ? 1 : 0, g: s.sides && s.sides.g === 1 ? 1 : 0 };
        s.missions = cleanMissions(s.missions);
        s.missionsAt = s.missions ? +s.missionsAt || 0 : 0;
        const b = s.battle,
          bn = b && s.nodes.find((n) => n.id === b.node);
        if (!bn || (bn.kind === "planet" && !bn.maps[b.map])) s.battle = null;
        else
          s.battle = {
            node: b.node,
            map: bn.kind === "planet" ? +b.map : -1,
            era: b.era === "c" || b.era === "g" ? b.era : null,
            die: +b.die || 0,
            free: !!b.free,
            mode: String(b.mode || "con"),
            space: String(b.space || ""),
            use: [0, 1].map((i) => {
              const picked = {},
                from = (b.use && b.use[i]) || {};
              BONUSES.forEach((x) => {
                if (from[x[0]]) picked[x[0]] = true;
              });
              return picked;
            }),
          };
        return s;
      }

      let state;
      let fresh = false; // no saved game: open on the new-game menu
      try {
        state = normalize(JSON.parse(localStorage.getItem(KEY)));
      } catch (e) {
        state = defaultState();
        fresh = true;
      }
      let shownBattle = ""; // the battle whose card has already been popped up on this screen
      let logOpen = false; // the log is a tab at the bottom edge until pulled up
      let placing = null, // commander index while choosing where a new fleet deploys
        modal = null; // open dialog: { kind: "confirm" | "newgame", ... }
      let edit = false,
        tool = "select",
        sel = null,
        laneStart = null;
      const undoStack = [];

      const nodeById = (id) => state.nodes.find((n) => n.id === id);
      const nodeR = (n) => (n.kind === "planet" ? n.size : 0.3);
      const fullOwner = (n) =>
        n.kind === "planet" && n.maps.length && n.maps.every((m) => m.owner === n.maps[0].owner)
          ? n.maps[0].owner
          : -1;
      const neighbours = (id) =>
        state.lanes.filter((l) => l.a === id || l.b === id).map((l) => (l.a === id ? l.b : l.a));
      const mapsOwned = (pi) =>
        state.nodes.reduce(
          (t, n) => t + (n.kind === "planet" ? n.maps.filter((m) => m.owner === pi).length : 0),
          0,
        );
      const capitalsHeld = (pi) =>
        state.nodes.filter((n) => n.kind === "planet" && n.capital && fullOwner(n) === pi).length;
      const income = (pi) =>
        mapsOwned(pi) * state.rules.incomePerMap + capitalsHeld(pi) * state.rules.capitalBonus;
      const fleetsOf = (pi) => state.fleets.filter((f) => f.owner === pi);
      const fleetCost = (pi) => {
        const n = fleetsOf(pi).length + 1;
        return n <= 1 ? 0 : state.rules.fleetBase * 2 ** (n - 2);
      };
      const moveCost = (pi) => state.rules.moveBase * 2 ** state.players[pi].movesBought;
      const canBeCapital = (n) => n.kind === "planet" && n.maps.length === 1; // one battle takes a capital
      const isUnclaimed = (n) => n.kind === "planet" && n.maps.length > 0 && n.maps.every((m) => m.owner < 0);
      const laneBetween = (a, b) =>
        state.lanes.find((l) => (l.a === a && l.b === b) || (l.b === a && l.a === b));
      const lanePoints = (l) => Math.max(0, Math.round(l.value));
      // Credits to cross a lane: one move point per point of lane value, each dearer than the last.
      function moveCostVia(pi, lane) {
        let c = 0;
        for (let k = 0; k < lanePoints(lane); k++)
          c += state.rules.moveBase * 2 ** (state.players[pi].movesBought + k);
        return c;
      }
      // Edit mode moves are free corrections; in play the commander must afford the lane.
      const canReach = (f, id) => {
        const l = laneBetween(f.node, id);
        return !!l && (edit || moveCostVia(f.owner, l) <= state.players[f.owner].credits);
      };
      // Where a new fleet may deploy: a planet the commander holds a map on (any planet if they hold none).
      function fleetSpots(pi) {
        if (edit) return state.nodes;
        const own = state.nodes.filter((n) => n.kind === "planet" && n.maps.some((m) => m.owner === pi));
        return own.length ? own : state.nodes.filter((n) => n.kind === "planet");
      }

      function save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(state));
        } catch (e) {
          /* storage unavailable */
        }
      }
      function pushUndo() {
        undoStack.push(JSON.stringify(state));
        if (undoStack.length > 80) undoStack.shift();
      }
      function commit() {
        netPublish();
        save();
        aimCamera();
        syncScene();
        renderUI();
      }
      function mutate(fn) {
        pushUndo();
        fn();
        commit();
      }
      function log(msg) {
        state.log.unshift("T" + state.turn + " · " + msg);
        state.log.length = Math.min(state.log.length, 80);
      }
      function undo() {
        if (!undoStack.length) return toast("Nothing to undo");
        state = JSON.parse(undoStack.pop());
        sel = null;
        laneStart = null;
        placing = null;
        commit();
      }
      let toastT;
      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastT);
        toastT = setTimeout(() => t.classList.remove("show"), 2200);
      }

      // ───────────────────────────── game actions ─────────────────────────────
      function spend(pi, cost, what) {
        const p = state.players[pi];
        if (p.credits < cost) {
          toast(p.name + " needs " + cost + " credits");
          return false;
        }
        pushUndo();
        p.credits -= cost;
        log(p.name + " bought " + what + (cost ? " (−" + cost + ")" : " (free)"));
        return true;
      }
      // In play mode a commander can only act on their own turn. Edit mode is the override.
      // Online, a player can also only act for the commander they are seated as.
      const offTurn = (pi) => !edit && (pi !== state.current || !mySeat(pi));
      const turnToast = () =>
        toast(
          !mySeat(state.current) && online()
            ? "You are not playing " + state.players[state.current].name
            : "It is " + state.players[state.current].name + "'s turn",
        );
      function buy(pi, what) {
        const p = state.players[pi],
          r = state.rules;
        // Last stand stays open off-turn: it answers a planet lost during the other commander's attack.
        if (state.phase === "draft") return toast("Finish picking planets first");
        if (!edit && !mySeat(pi)) return toast("You are not playing " + p.name);
        if (what !== "stand" && offTurn(pi)) return turnToast();
        if (what === "fleet") {
          if (placing === pi) placing = null;
          else if (fleetCost(pi) > p.credits) return toast(p.name + " needs " + fleetCost(pi) + " credits");
          else {
            placing = pi;
            sel = null;
          }
          return commit();
        } else if (what === "faction") {
          if (!spend(pi, r.factionPick, "a faction pick")) return;
        } else if (what === "stand") {
          if (!spend(pi, r.lastStand, "a LAST STAND — it uses their next turn")) return;
          p.lastStandAt = state.ply;
        }
        commit();
      }
      function buyBonus(pi, key) {
        const p = state.players[pi],
          bonus = BONUSES.find((b) => b[0] === key);
        if (!bonus) return;
        if (state.phase === "draft") return toast("Finish picking planets first");
        if (!edit && !mySeat(pi)) return toast("You are not playing " + p.name);
        if (offTurn(pi)) return turnToast();
        if (!spend(pi, bonusCost(key), "the " + bonus[1] + " bonus")) return;
        p.bonuses[key]++;
        commit();
      }
      function confirmFleet(pi, node) {
        const p = state.players[pi],
          cost = fleetCost(pi);
        modal = {
          kind: "confirm",
          text:
            "Deploy " +
            p.name +
            "'s fleet at " +
            node.name +
            (cost ? " for " + cost + " credits?" : " for free?"),
          onYes: () => {
            placing = null;
            if (spend(pi, fleetCost(pi), "a fleet at " + node.name)) {
              const f = { id: uid("f"), owner: pi, node: node.id };
              state.fleets.push(f);
              sel = { kind: "fleet", id: f.id };
            }
            commit();
          },
        };
        renderModal();
      }
      // Records who won. Ends the battle being set up, and uses up any hero fielded in it.
      function battle(node, mapIdx, winner) {
        mutate(() => {
          const W = state.players[winner],
            L = state.players[1 - winner],
            r = state.rules;
          W.credits += r.battleWin;
          L.credits += r.battleLoss;
          let where = node.name;
          if (mapIdx >= 0) {
            node.maps[mapIdx].owner = winner;
            where += ": " + node.maps[mapIdx].name;
          }
          const b = state.battle;
          if (b && b.node === node.id && b.map === mapIdx) {
            state.players.forEach((p, i) => {
              // every bonus fielded in this battle is used up
              Object.keys(b.use[i]).forEach((key) => {
                if (p.bonuses[key] > 0) p.bonuses[key]--;
              });
            });
            state.battle = null;
          }
          log(W.name + " won at " + where + " (+" + r.battleWin + "), " + L.name + " +" + r.battleLoss);
        });
      }
      // The mission code for the battle as currently set up, or "" if something is still missing.
      function battleMission(b) {
        if (!b || !b.era) return "";
        const n = nodeById(b.node);
        if (b.map < 0) return b.space ? b.space + b.era + "_ass" : "";
        const m = n.maps[b.map];
        return m.code ? m.code + b.era + "_" + battleMode(b) : "";
      }
      // A battle set up or changed in edit mode is "free": any era, any mode and any bonus can be set
      // on it, whether or not it has been bought. The mark travels with the battle, so the other
      // player's card shows the same thing.
      const freeBattle = (b) => edit || !!(b && b.free);
      const markFree = () => {
        if (edit && state.battle) state.battle.free = true;
      };
      // Eras this battle can be fought in: what the game really has for the map, when that is known.
      function battleEras(b) {
        if (b.map < 0 || freeBattle(b)) return "cg";
        const m = nodeById(b.node).maps[b.map],
          cat = catalogOf(m.code);
        return (cat && ["c", "g"].filter((e) => cat[e]).join("")) || m.eras;
      }
      // Modes on offer: only the ones the game has for this map and era, when that is known.
      function battleModes(b) {
        if (b.map < 0) return [["ass", "Space assault"]];
        const cat = catalogOf(nodeById(b.node).maps[b.map].code),
          real = cat && b.era && cat[b.era] ? MODES.filter((x) => cat[b.era].includes(x[0])) : [];
        return real.length && !freeBattle(b) ? real : MODES;
      }
      // The chosen mode, or the first one on offer if the chosen one does not exist for this map.
      function battleMode(b) {
        const modes = battleModes(b);
        return modes.some((x) => x[0] === b.mode) ? b.mode : modes[0][0];
      }
      function setBattleEra(b, era, die) {
        b.era = era;
        b.die = die || 0;
        const spaces = spaceMapsFor(era);
        if (b.map < 0 && !spaces.some((s) => s[0] === b.space)) b.space = spaces[0][0];
        if (b.map >= 0) b.mode = battleMode(b);
      }
      // Opens the battle card for a map (or for a space point when mapIdx is -1).
      function startBattle(node, mapIdx) {
        const b = state.battle;
        if (b && b.node === node.id && b.map === mapIdx) {
          modal = { kind: "battle" };
          return renderModal();
        }
        if (b) {
          // Another battle is still open. Show it, and say so, with a one-click way to move on.
          modal = { kind: "battle", wanted: { node: node.id, map: mapIdx } };
          return renderModal();
        }
        if (!edit && state.phase === "draft") return toast("Finish picking planets first");
        if (!edit && !mySeat(state.current)) return turnToast();
        mutate(() => {
          const nb = (state.battle = {
            node: node.id,
            map: mapIdx,
            era: null,
            die: 0,
            free: edit,
            mode: "con",
            space: "",
            use: [{}, {}],
          });
          const eras = battleEras(nb);
          if (eras.length === 1) setBattleEra(nb, eras, 0);
          log("Battle called at " + node.name + (mapIdx >= 0 ? ": " + node.maps[mapIdx].name : ""));
        });
      }
      // Asks the launcher helper (installed by mods/install-mods) to start the game on this mission.
      // A hidden frame is used so a PC without the helper just does nothing instead of leaving the page.
      function launchGame(mission) {
        if (!/^[a-z0-9]{3,8}[cg]_[a-z0-9]{2,8}$/.test(mission))
          return toast("No mission code for this battle yet");
        const frame = document.createElement("iframe");
        frame.style.display = "none";
        frame.src = "seanquest://launch?mission=" + mission;
        document.body.appendChild(frame);
        setTimeout(() => frame.remove(), 3000);
        toast("Asked the launcher to start " + mission);
        // A page cannot ask Windows whether the launcher exists. What it can see is the browser losing
        // focus, which happens when the launcher (or the browser's "open this link?" box) comes up.
        // No loss of focus within a few seconds is taken to mean there is no launcher on this PC.
        if (localStorage.getItem(LAUNCHER_FLAG)) return;

        document.addEventListener("visibilitychange", saw);
        setTimeout(() => {
          removeEventListener("blur", saw);
          document.removeEventListener("visibilitychange", saw);
          if (seen) return localStorage.setItem(LAUNCHER_FLAG, "1");

        }, 2500);
      }
      const LAUNCHER_FLAG = "gazacktic-seanquest.launcher"; // set once the launcher is known to be on this PC
      const LAUNCHER_URL = "https://oatsphoenix.github.io/gazackticseanquest/mods/install-launcher.bat";
      function renderLauncherModal() {
        $("modalBox").innerHTML =
          "<h2>Launcher not found on this PC</h2>" +
          '<div class="mtext">Launch game needs a small helper installed once on each Windows PC. It did not respond, so it is probably not installed here yet.</div>' +
          '<div class="mlabel">Install it</div><ol>' +
          '<li>Download <a href="' +
          LAUNCHER_URL +
          '" download style="color:var(--or)">install-launcher.bat</a>.</li>' +
          "<li>Double-click it. If Windows asks whether to run it, choose Run (or More info, then Run anyway).</li>" +
          "<li>It finds Battlefront II and sets the launcher up first. It then offers the mod set: press N at that menu if you only want the launcher.</li>" +
          "<li>Come back here and press Try again. The first time, your browser asks whether to open the link: allow it.</li></ol>" +
          '<div class="hint" style="margin-top:10px">The mission for this battle is <span class="code">' +
          esc(modal.mission) +
          "</span>. Without the launcher you can still start it by hand from the steps on the battle card.</div>" +
          '<div class="grid go"><button class="btn on" data-act="launchretry">Try again</button><button class="btn" data-act="launcherok" title="Use this if the game did start">It is installed: stop asking</button></div>' +
          '<div class="grid" style="margin-top:6px"><span></span><button class="btn" data-act="launcherback">Back to the battle</button></div>';
      }
      function endTurn() {
        if (state.phase === "draft") return toast("Finish picking planets first");
        if (!edit && !mySeat(state.current)) return turnToast();
        placing = null;
        mutate(() => {
          const pi = state.current,
            p = state.players[pi],
            inc = income(pi);
          p.credits += inc;
          p.movesBought = 0;
          if (p.lastStandAt !== null && state.ply > p.lastStandAt) p.lastStandAt = null;
          log(
            p.name +
              " ended their turn, income +" +
              inc +
              " (" +

        g.clear();
      }
      const flat = (geo, mat) => {
        const m = new THREE.Mesh(geo, mat);
        m.rotation.x = -Math.PI / 2;
        return m;
      };
      const basic = (color, opacity, add) =>
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity,
          side: THREE.DoubleSide,
          depthWrite: false,
          blending: add ? THREE.AdditiveBlending : THREE.NormalBlending,
        });
      function addLabel(cls, html, x, z, r, color) {
        const el = document.createElement("div");
        el.className = "lbl " + cls;
        el.innerHTML = html;
        if (color) el.style.color = color;
        labelRoot.appendChild(el);
        labels.push({ el, x, z, r });
      }
      function reticle(r) {
        const g = new THREE.Group();
        for (let i = 0; i < 4; i++)
          g.add(
            flat(
              new THREE.RingGeometry(r, r + 0.08, 20, 1, (i * Math.PI) / 2 + 0.25, Math.PI / 2 - 0.5),
              basic(0xffb648, 0.95, true),
            ),
          );
        reticles.push(g);
        return g;
      }

      function syncScene() {
        disposeGroup(board);
        disposeGroup(fleetLayer);
        pickables = [];
        spinners = [];
        reticles = [];
        pulses = [];
        lanePulses = [];
        labels = [];
        fleetObjs.clear();
        labelRoot.innerHTML = "";
        const selFleet = sel && sel.kind === "fleet" ? state.fleets.find((f) => f.id === sel.id) : null;
        const glow = new Set(); // nodes that pulse: fleet moves, fleet deploy spots, planets left in the draft
        if (placing !== null) fleetSpots(placing).forEach((n) => glow.add(n.id));
        else if (state.phase === "draft" && !edit)
          state.nodes.filter(isUnclaimed).forEach((n) => glow.add(n.id));
        else if (selFleet && !offTurn(selFleet.owner))
          neighbours(selFleet.node)
            .filter((id) => canReach(selFleet, id))
            .forEach((id) => glow.add(id));

        for (const l of state.lanes) {
          const a = nodeById(l.a),
            b = nodeById(l.b);
          if (!a || !b) continue;
          const va = new THREE.Vector3(a.x, 0, a.z),
            vb = new THREE.Vector3(b.x, 0, b.z),
            dir = vb.clone().sub(va),
            len = dir.length();
          if (len < 0.01) continue;
          dir.normalize();
          const p0 = va.clone().addScaledVector(dir, nodeR(a) + 0.12),
            p1 = vb.clone().addScaledVector(dir, -(nodeR(b) + 0.12));
          const L = Math.max(0.05, p0.distanceTo(p1)),
            mid = p0.clone().add(p1).multiplyScalar(0.5),
            on = sel && sel.kind === "lane" && sel.id === l.id;
          const q = new THREE.Quaternion().setFromUnitVectors(Y, dir);
          const beam = new THREE.Mesh(
            new THREE.CylinderGeometry(on ? 0.07 : 0.035, on ? 0.07 : 0.035, L, 6),
            basic(on ? 0xffb648 : 0x39c5ff, on ? 0.95 : 0.6, true),
          );
          beam.position.copy(mid);
          beam.quaternion.copy(q);
          board.add(beam);
          const hitbox = new THREE.Mesh(
            new THREE.CylinderGeometry(0.2, 0.2, L, 6),
            basic(0xffffff, 0, false),
          );
          hitbox.position.copy(mid);
          hitbox.quaternion.copy(q);
          hitbox.userData = { kind: "lane", id: l.id };
          board.add(hitbox);
          pickables.push(hitbox);
          const sp = glowSprite(0x9fe4ff, 0.35, 0.9);
          board.add(sp);
          lanePulses.push({ sp, p0, p1, off: (seedOf(l.id) % 100) / 100 });
          if (l.value !== 1 || on) addLabel("lane", esc(l.value), mid.x, mid.z, 0);
        }

        for (const n of state.nodes) {
          const g = new THREE.Group();
          g.position.set(n.x, 0, n.z);
          board.add(g);
          const on = sel && sel.kind === "node" && sel.id === n.id,
            R = nodeR(n);
          if (n.kind === "planet") {
            const T = TYPES[n.type] || TYPES.rock,
              tex = planetTexture(n.type, seedOf(n.id));
            const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92, metalness: 0 });
            if (T.emis) {
              mat.emissiveMap = tex;
              mat.emissive = new THREE.Color(T.emis[0]);
              mat.emissiveIntensity = T.emis[1];
            }
            const m = new THREE.Mesh(new THREE.SphereGeometry(R, 48, 32), mat);
            m.rotation.z = 0.3;
            m.userData = { kind: "node", id: n.id };
            g.add(m);
            pickables.push(m);
            spinners.push(m);
            g.add(glowSprite(T.atm, R * 3.3, 0.5));
            if (n.ring) {
              const rg = flat(new THREE.RingGeometry(R * 1.35, R * 2.05, 64), basic(T.atm, 0.38, false));
              rg.rotation.x = -Math.PI / 2 + 0.45;
              rg.rotation.y = 0.2;
              g.add(rg);
            }
            const k = n.maps.length || 1,
              gap = k > 1 ? 0.16 : 0,
              base = n.ring ? R * 2.2 : R + 0.28;
            for (let i = 0; i < k; i++) {
              const o = n.maps[i] ? n.maps[i].owner : -1;
              g.add(
                flat(
                  new THREE.RingGeometry(
                    base,
                    base + 0.1,
                    48,
                    1,
                    (i * 6.2832) / k + gap / 2,
                    6.2832 / k - gap,
                  ),
                  basic(o >= 0 ? state.players[o].color : 0x5a6b7a, o >= 0 ? 1 : 0.5, o >= 0),
                ),
              );
            }
            if (n.capital)
              g.add(flat(new THREE.RingGeometry(base + 0.2, base + 0.25, 64), basic(0xffd76a, 0.9, true)));
            if (on) g.add(reticle(base + 0.42));
            const fo = fullOwner(n),
              pips = n.maps
                .map(
                  (m) =>
                    '<i style="' +
                    (m.owner >= 0 ? "background:" + state.players[m.owner].color : "") +
                    '"></i>',
                )
                .join("");
            addLabel(
              "",
              '<div class="nm">' +
                (n.capital ? "★ " : "") +
                esc(n.name) +
                (state.phase === "draft" && !edit && isUnclaimed(n)
                  ? " · " + n.maps.length + (n.maps.length === 1 ? " map" : " maps")
                  : "") +
                '</div><div class="pips">' +
                pips +
                "</div>",
              n.x,
              n.z,
              base + 0.3,
              fo >= 0 ? state.players[fo].color : "",
            );
          } else {
            const t = new THREE.Mesh(
              new THREE.TorusGeometry(0.28, 0.035, 8, 40),
              basic(on ? 0xffb648 : 0x7fd8ff, 0.95, true),
            );
            t.rotation.x = Math.PI / 2;
            g.add(t);
            g.add(new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), basic(0xcff3ff, 1, true)));
            g.add(glowSprite(0x39c5ff, 1.1, 0.35));
            const hb = new THREE.Mesh(new THREE.SphereGeometry(0.36, 10, 8), basic(0xffffff, 0, false));
            hb.userData = { kind: "node", id: n.id };
            g.add(hb);
            pickables.push(hb);
            if (on) g.add(reticle(0.5));
            if (n.name && n.name !== "Open space") addLabel("sp", esc(n.name), n.x, n.z, 0.45);
          }
          if (glow.has(n.id) || laneStart === n.id) {
            const pr = flat(
              new THREE.RingGeometry(R + 0.55, R + 0.68, 48),
              basic(laneStart === n.id ? 0xffb648 : 0x9dffb0, 0.9, true),
            );
            g.add(pr);
            pulses.push(pr);
          }
        }

        const perNode = {};
        for (const f of state.fleets) {
          const g = new THREE.Group(),
            col = new THREE.Color(state.players[f.owner].color),
            on = selFleet === f;
          const geo = new THREE.ConeGeometry(0.19, 0.7, 4);
          geo.rotateX(Math.PI / 2);
          geo.scale(1.35, 0.42, 1);
          g.add(
            new THREE.Mesh(
              geo,
              new THREE.MeshStandardMaterial({
                color: col,
                emissive: col,
                emissiveIntensity: 0.9,
                roughness: 0.5,
                flatShading: true,
              }),
            ),
          );
          g.add(glowSprite(col, on ? 1.6 : 1.0, on ? 0.95 : 0.7));
          if (on) g.add(reticle(0.42));
          const hb = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 6), basic(0xffffff, 0, false));
          hb.userData = { kind: "fleet", id: f.id };
          g.add(hb);
          pickables.push(hb);
          if (on) g.scale.setScalar(1.35);
          const list = (perNode[f.node] = perNode[f.node] || []);
          list.push(f.id);
          fleetLayer.add(g);
          fleetObjs.set(f.id, { g, f, idx: list.length - 1, list });
          if (fleetPos.has(f.id)) g.position.copy(fleetPos.get(f.id));
        }
        for (const id of [...fleetPos.keys()]) if (!fleetObjs.has(id)) fleetPos.delete(id);
        // Rebuilt objects have no world position until the next rendered frame; a click landing
        // before that frame would miss everything, so place them now.
        updateFleets(performance.now() / 1000, 0);
        board.updateMatrixWorld(true);
        fleetLayer.updateMatrixWorld(true);
      }

      const tmpV = new THREE.Vector3(),
        tmpD = new THREE.Vector3();
      function updateFleets(t, dt) {
        for (const [id, o] of fleetObjs) {
          const n = nodeById(o.f.node);
          if (!n) continue;
          const a = t * 0.35 + (o.idx * 6.2832) / o.list.length,
            r = nodeR(n) + (n.kind === "planet" && n.ring ? 1.3 : 0.55);
          tmpV.set(n.x + Math.cos(a) * r, 0.22, n.z + Math.sin(a) * r);
          let cur = fleetPos.get(id);
          if (!cur) {
            cur = tmpV.clone();
            fleetPos.set(id, cur);
          }
          tmpD.copy(tmpV).sub(cur);
          if (tmpD.length() > 0.6) tmpD.normalize();
          else tmpD.set(-Math.sin(a), 0, Math.cos(a));
          cur.lerp(tmpV, 1 - Math.exp(-dt * 3.5));
          o.g.position.copy(cur);
          o.g.lookAt(tmpV.copy(cur).add(tmpD));
        }
      }
      function updateLabels() {
        const w = innerWidth,
          h = innerHeight,
          f = h / (2 * Math.tan((camera.fov * Math.PI) / 360));
        for (const L of labels) {
          tmpV.set(L.x, 0, L.z);
          const dist = camera.position.distanceTo(tmpV);
          tmpV.project(camera);
          if (tmpV.z > 1) {
            L.el.style.display = "none";
            continue;
          }
          const sx = (tmpV.x * 0.5 + 0.5) * w,
            sy = (-tmpV.y * 0.5 + 0.5) * h + (L.r ? ((L.r * f) / dist) * 0.62 + 3 : 0);
          L.el.style.display = "";
          L.el.style.transform =
            "translate(" +
            sx.toFixed(1) +
            "px," +
            sy.toFixed(1) +
            "px) translate(-50%," +
            (L.r ? "0" : "-50%") +
            ")";
        }
      }
      function resize() {
        renderer.setSize(innerWidth, innerHeight, false);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      }
      addEventListener("resize", resize);

      let last = performance.now();
      function frame(now) {
        const t = now / 1000,
          dt = Math.min(0.1, (now - last) / 1000);
        last = now;
        const ease = 1 - Math.exp(-dt * 3.2);
        cam.target.lerp(goal.target, ease);
        cam.r += (goal.r - cam.r) * ease;
        cam.theta += (goal.theta - cam.theta) * ease;
        cam.phi += (goal.phi - cam.phi) * ease;
        const sp = Math.sin(cam.phi);
        camera.position.set(
          cam.target.x + cam.r * sp * Math.sin(cam.theta),
          cam.target.y + cam.r * Math.cos(cam.phi),
          cam.target.z + cam.r * sp * Math.cos(cam.theta),
        );
        camera.lookAt(cam.target);
        for (const m of spinners) m.rotation.y += dt * 0.12;
        for (const r of reticles) r.rotation.y = t * 0.9;
        for (const p of pulses) {
          const s = 1 + 0.08 * Math.sin(t * 5);
          p.scale.set(s, s, 1);
          p.material.opacity = 0.55 + 0.4 * Math.sin(t * 5);
        }
        for (const lp of lanePulses) lp.sp.position.lerpVectors(lp.p0, lp.p1, (t * 0.12 + lp.off) % 1);
        galaxy.rotation.y = t * 0.006;
        updateFleets(t, dt);
        renderer.render(scene, camera);
        updateLabels();
        requestAnimationFrame(frame);
      }

      // ───────────────────────────── pointer input ─────────────────────────────
      const ray = new THREE.Raycaster(),
        ndc = new THREE.Vector2(),
        ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      function aim(e) {
        ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
        ray.setFromCamera(ndc, camera);
      }
      function pick(e) {
        aim(e);
        const hits = ray.intersectObjects(pickables, false);
        const h = hits.find((x) => x.object.userData.kind !== "lane") || hits[0];
        return h ? h.object.userData : null;
      }
      function groundPoint(e) {
        aim(e);
        const p = new THREE.Vector3();
        return ray.ray.intersectPlane(ground, p) ? p : null;
      }
      const r1 = (v) => Math.round(v * 10) / 10;

      let drag = null;
      canvas.addEventListener("pointerdown", (e) => {
        canvas.setPointerCapture(e.pointerId);
        const hit = pick(e);
        drag = {
          x: e.clientX,
          y: e.clientY,
          sx: e.clientX,
          sy: e.clientY,
          moved: false,
          hit,
          mode: e.button === 2 || e.shiftKey ? "pan" : "orbit",
        };
        if (e.button === 0 && edit && tool === "move" && hit && hit.kind === "node") {
          drag.mode = "node";
          sel = hit;
        }
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!drag) {
          canvas.style.cursor = pick(e)
            ? "pointer"
            : edit && (tool === "planet" || tool === "space")
              ? "crosshair"
              : "grab";
          return;
        }
        const dx = e.clientX - drag.x,
          dy = e.clientY - drag.y;
        drag.x = e.clientX;
        drag.y = e.clientY;
        if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
        if (!drag.moved && drag.mode === "node") pushUndo();
        drag.moved = true;
        if (drag.mode === "orbit") {
          cam.theta -= dx * 0.005;
          goal.theta -= dx * 0.005;
          goal.phi = clamp(goal.phi - dy * 0.005, 0.12, 1.5);
          cam.phi = clamp(cam.phi - dy * 0.005, 0.12, 1.5);
        } else if (drag.mode === "pan") {
          const s = cam.r * 0.0016,
            c = Math.cos(cam.theta),
            sn = Math.sin(cam.theta);
          const px = (-c * dx - sn * dy) * s,
            pz = (sn * dx - c * dy) * s;
          cam.target.x += px;
          cam.target.z += pz;
          goal.target.x += px;
          goal.target.z += pz;
        } else {
          const p = groundPoint(e),
            n = nodeById(drag.hit.id);
          if (p && n) {
            n.x = r1(p.x);
            n.z = r1(p.z);
            syncScene();
          }
        }
      });
      canvas.addEventListener("pointerup", (e) => {
        const d = drag;
        drag = null;
        if (!d) return;
        if (d.moved) {
          if (d.mode === "node") commit();
          return;
        }
        if (e.button === 0) click(d.hit, e);
      });
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          goal.r = clamp(goal.r * Math.exp(e.deltaY * 0.001), 5, 75);
        },
        { passive: false },
      );

      function click(hit, e) {
        if (placing !== null) {
          if (hit && hit.kind === "node" && fleetSpots(placing).some((n) => n.id === hit.id))
            return confirmFleet(placing, nodeById(hit.id));
          return toast("Pick a pulsing planet for the new fleet");
        }
        if (state.phase === "draft" && !edit && hit && hit.kind === "node" && isUnclaimed(nodeById(hit.id)))
          return mySeat(state.current) ? draftPick(nodeById(hit.id)) : turnToast();
        if (edit && (tool === "planet" || tool === "space")) {
          const p = groundPoint(e);
          if (!p) return;
          mutate(() => {
            const n =
              tool === "planet"
                ? {
                    id: uid("p"),
                    kind: "planet",
                    name: "New planet",
                    type: "rock",
                    size: 0.7,
                    x: r1(p.x),
                    z: r1(p.z),
                    ring: false,
                    capital: false,
                    maps: [{ name: "Map 1", owner: -1 }],
                  }
                : { id: uid("s"), kind: "space", name: "Open space", x: r1(p.x), z: r1(p.z) };
            state.nodes.push(n);
            sel = { kind: "node", id: n.id };
            tool = "select";
          });
          return;
        }
        if (edit && tool === "lane") {
          if (!hit || hit.kind !== "node") {
            laneStart = null;
            return commit();
          }
          if (!laneStart) {
            laneStart = hit.id;
            return commit();
          }
          const a = laneStart,
            b = hit.id;
          laneStart = null;
          if (a === b) return commit();
          if (state.lanes.some((l) => (l.a === a && l.b === b) || (l.a === b && l.b === a))) {
            toast("Those two are already linked");
            return commit();
          }
          return mutate(() => {
            const l = { id: uid("l"), a, b, value: 1 };
            state.lanes.push(l);
            sel = { kind: "lane", id: l.id };
          });
        }
        if (edit && tool === "delete") {
          if (hit) deleteThing(hit);
          return;
        }
        const f = sel && sel.kind === "fleet" ? state.fleets.find((x) => x.id === sel.id) : null;
        if (f && hit && hit.kind === "node" && hit.id !== f.node) {
          if (offTurn(f.owner)) turnToast();
          else if (neighbours(f.node).includes(hit.id)) return moveFleet(f, nodeById(hit.id));
          else toast("No lane from here to there");
        }
        sel = hit ? { kind: hit.kind, id: hit.id } : null;
        commit();
      }

      // ───────────────────────────── menus ─────────────────────────────
      const HINTS = {
        select: "Click a planet, lane or fleet to edit it. Drag to orbit, right-drag to pan, wheel to zoom.",
        move: "Drag a planet or space point to reposition it on the board.",
        delete: "Click a planet, space point, lane or fleet to remove it.",
        planet: "Click empty space to place a new planet.",
        space: "Click empty space to place an open-space point.",
        lane: "Click one node, then another, to link them with a lane.",
      };
      const chips = (act, cur) =>
        '<button class="chip' +
        (cur < 0 ? " on" : "") +
        '" data-act="' +
        act +
        ':-1" title="Neutral">–</button>' +
        state.players
          .map(
            (p, i) =>
              '<button class="chip' +
              (cur === i ? " on" : "") +
              '" style="--pc:' +
              p.color +
              '" data-act="' +
              act +
              ":" +
              i +
              '" title="' +
              esc(p.name) +
              ' holds this map">' +
              esc(p.name[0] || i + 1) +
              "</button>",
          )
          .join("");
      const fleetRows = (list, short) =>
        list
          .map(
            (f) =>
              '<div class="fl"><button class="btn' +
              (sel && sel.id === f.id ? " on" : "") +
              '" data-act="selfleet:' +
              f.id +
              '" style="border-left:4px solid ' +
              state.players[f.owner].color +
              '">' +
              (short ? "Fleet" : esc(state.players[f.owner].name) + " fleet") +
              " @ " +
              esc((nodeById(f.node) || {}).name || "?") +
              '</button><button class="btn warn" data-act="delfleet:' +
              f.id +
              '" title="Remove (destroyed)">✕</button></div>',
          )
          .join("");

      function renderSelection() {
        const dis = edit ? "" : " disabled";
        let h = "";
        if (!sel)
          h =
            state.phase === "draft" && !edit
              ? '<div class="hint">Click a pulsing planet to claim it.<br><br><b style="color:var(--or)">Planets are not equal:</b> each has a different number of maps, shown under its name. More maps means more income every turn, but more battles to take it or to lose it.' +
                (state.draftCapitals ? " Your first single-map pick becomes your capital." : "") +
                "</div>"
              : '<div class="hint">Nothing selected. Click a planet to set who holds its maps, or a fleet to move it.</div>';
        else if (sel.kind === "node") {
          const n = nodeById(sel.id);
          if (!n) {
            sel = null;
            return renderSelection();
          }
          h +=
            '<div class="row"><label>Name</label><input data-f="name" value="' +
            esc(n.name) +
            '"' +
            dis +
            "></div>";
          if (n.kind === "planet") {
            h +=
              '<div class="edit-only"><div class="row"><label>Surface</label><select data-f="type">' +
              Object.keys(TYPES)
                .map((t) => "<option" + (t === n.type ? " selected" : "") + ">" + t + "</option>")
                .join("") +
              "</select></div>" +
              '<div class="row"><label>Size</label><input type="range" data-f="size" min=".3" max="1.5" step=".05" value="' +
              n.size +
              '"></div>' +
              '<div class="row"><label>Rings</label><input type="checkbox" data-f="ring"' +
              (n.ring ? " checked" : "") +
              "></div></div>" +
              '<div class="row"><label>Capital</label><input type="checkbox" data-f="capital"' +
              (n.capital ? " checked" : "") +
              (canBeCapital(n) ? "" : " disabled") +
              '><span style="color:var(--dim);font-size:11px">' +
              (canBeCapital(n)
                ? "+" + state.rules.capitalBonus + "/turn to whoever holds it"
                : "Only a planet with exactly one map can be a capital") +
              "</span></div>" +
              '<h2 style="margin-top:10px">Maps · holder · battle result</h2>';
            n.maps.forEach((m, i) => {
              h +=
                '<div class="map">' +
                (edit
                  ? '<input class="mn" data-f="map" data-i="' + i + '" value="' + esc(m.name) + '">'
                  : '<span class="mn">' + esc(m.name) + "</span>") +
                chips("own:" + i, m.owner) +
                '<button class="chip b' +
                (state.battle && state.battle.node === n.id && state.battle.map === i ? " on" : "") +
                '" style="--pc:var(--or)" data-act="battleopen:' +
                i +
                '" title="Set up a battle on this map: era, sides, mode and launch">Battle</button>' +
                '<button class="chip edit-only" data-act="delmap:' +
                i +
                '" title="Remove map">✕</button></div>' +
