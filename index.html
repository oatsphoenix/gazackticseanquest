      // ───────────────────────────── online play (browser to browser) ─────────────────────────────
      // One browser hosts and holds the real game; the other connects straight to it (WebRTC, through
      // the PeerJS library). A public PeerJS server only introduces the two browsers to each other.
      //   guest -> host : hello { want }            ask for a seat
      //                   propose { base, state }   "I changed the game from revision <base> to this"
      //   host  -> guest: welcome { seat, rev, state }
      //                   state { rev, state, by, rejected }   the game after every accepted change
      //   both ways     : ping
      const ROOM_PREFIX = "gazackticseanquest-";
      const net = {
        role: null, // null (offline), "host" or "guest"
        room: "",
        seat: -1, // commander index this browser plays; -1 = watching only
        peer: null,
        conns: [], // host: one per connected browser; guest: the one link to the host
        rev: 0, // revision number of the shared game
        lastJson: "", // the game as last agreed with the other side
        status: "off", // off | starting | waiting | connected | lost | error
        note: "",
        timer: null,
      };
      const online = () => net.role !== null;
      const mySeat = (pi) => !online() || net.seat === pi;
      const roomLink = (code) => location.origin + location.pathname + "?room=" + code;
      const newRoomCode = () =>
        Array.from(
          { length: 6 },
          () => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random() * 32)],
        ).join("");

      function netStatus(status, note) {
        net.status = status;
        net.note = note || "";
        renderUI();
      }
      function netSend(conn, msg) {
        try {
          if (conn && conn.open) conn.send(msg);
        } catch (e) {
          /* the close handler deals with a dead link */
        }
      }
      const netBroadcast = (msg) => net.conns.forEach((c) => netSend(c, msg));

      // Called on every commit: if the game changed, tell the other side.
      function netPublish() {
        if (!online()) return;
        const json = JSON.stringify(state);
        if (json === net.lastJson) return;
        if (net.role === "host") {
          net.rev++;
          net.lastJson = json;
          netBroadcast({ t: "state", rev: net.rev, state, by: "host" });
        } else if (net.status === "connected") {
          net.lastJson = json; // shown at once; the host's reply confirms or replaces it
          netSend(net.conns[0], { t: "propose", base: net.rev, state });
        } else {
          state = JSON.parse(net.lastJson);
          toast("Not connected: that change was not made");
        }
      }
      // Replace the local game with the shared one.
      function netApply(remote, keepUndo) {
        state = normalize(remote);
        net.lastJson = JSON.stringify(state);
        if (!keepUndo) undoStack.length = 0; // undo reaches back only to the other side's last action
        placing = null;
        if (modal && modal.kind === "confirm") modal = null;
        if (sel && sel.kind === "node" && !nodeById(sel.id)) sel = null;
        if (sel && sel.kind === "fleet" && !state.fleets.some((f) => f.id === sel.id)) sel = null;
        if (sel && sel.kind === "lane" && !state.lanes.some((l) => l.id === sel.id)) sel = null;
        save();
        aimCamera();
        syncScene();
        renderUI();
      }
      function netStop(quiet) {
        clearInterval(net.timer);
        net.conns.forEach((c) => {
          try {
            c.close();
          } catch (e) {}
        });
        if (net.peer)
          try {
            net.peer.destroy();
          } catch (e) {}
        Object.assign(net, {
          role: null,
          room: "",
          seat: -1,
          peer: null,
          conns: [],
          rev: 0,
          lastJson: "",
          status: "off",
          note: "",
          timer: null,
        });
        sessionStorage.removeItem("gzsq-host");
        if (new URLSearchParams(location.search).get("room"))
          history.replaceState(null, "", location.pathname);
        if (!quiet) renderUI();
      }
      // A link that has been silent for 15 seconds is treated as dead; each side pings every 4.
      function netHeartbeat() {
        clearInterval(net.timer);
        net.timer = setInterval(() => {
          const now = Date.now();
          net.conns.forEach((c) => {
            netSend(c, { t: "ping" });
            if (c.open && now - (c.seen || now) > 15000) c.close();
          });
        }, 4000);
      }

      function netHost(seat, room) {
        if (typeof Peer === "undefined")
          return toast("Online play could not load (peerjs.min.js is missing)");
        netStop(true);
        Object.assign(net, {
          role: "host",
          room: room || newRoomCode(),
          seat,
          lastJson: JSON.stringify(state),
          rev: 1,
        });
        sessionStorage.setItem("gzsq-host", JSON.stringify({ room: net.room, seat }));
        netStatus("starting", "Opening the room...");
        const peer = (net.peer = new Peer(ROOM_PREFIX + net.room, { debug: 0 }));
        peer.on("open", () => netStatus(net.conns.some((c) => c.open) ? "connected" : "waiting"));
        peer.on("disconnected", () => {
          // lost the introduction server only; anyone already connected stays connected
          if (net.peer === peer && !peer.destroyed)
            setTimeout(() => net.peer === peer && !peer.destroyed && peer.reconnect(), 3000);
        });
        peer.on("error", (err) => {
          if (net.peer !== peer) return;
          if (err.type === "unavailable-id") {
            // the code is still held by this room's previous session (a reload); it frees up shortly
            netStatus("starting", "Reopening the room...");
            const code = net.room;
            setTimeout(() => net.peer === peer && netHost(seat, code), 4000);
          } else if (err.type !== "peer-unavailable")
            netStatus(net.conns.some((c) => c.open) ? "connected" : "error", "Network problem: " + err.type);
        });
        peer.on("connection", (conn) => {
          conn.on("open", () => {
            conn.seen = Date.now();
            net.conns.push(conn);
          });
          conn.on("data", (msg) => {
            conn.seen = Date.now();
            if (!msg || net.peer !== peer) return;
            if (msg.t === "hello") {
              // The first browser to ask gets the free commander; a browser coming back keeps its seat.
              const other = 1 - net.seat,
                taken = net.conns.some((c) => c !== conn && c.open && c.seat === other);
              conn.seat = taken ? -1 : other;
              netSend(conn, { t: "welcome", seat: conn.seat, rev: net.rev, state });
              netStatus("connected");
            } else if (msg.t === "propose") {
              if (msg.base === net.rev && conn.seat >= 0) {
                net.rev++;
                netApply(msg.state);
                netBroadcast({ t: "state", rev: net.rev, state, by: conn.peer });
              } else netSend(conn, { t: "state", rev: net.rev, state, by: "host", rejected: true });
            }
          });
          const gone = () => {
            net.conns = net.conns.filter((c) => c !== conn);
            if (net.peer === peer) netStatus(net.conns.some((c) => c.open) ? "connected" : "waiting");
          };
          conn.on("close", gone);
          conn.on("error", gone);
        });
        netHeartbeat();
      }

      function netJoin(room) {
        if (typeof Peer === "undefined")
          return toast("Online play could not load (peerjs.min.js is missing)");
        room = String(room || "")
          .trim()
          .toUpperCase()
          .replace(/[^A-Z0-9]/g, "");
        if (!room) return toast("Type the room code first");
        netStop(true);
        Object.assign(net, { role: "guest", room, seat: -1, lastJson: JSON.stringify(state) });
        history.replaceState(null, "", location.pathname + "?room=" + room); // so a reload rejoins
        netStatus("starting", "Connecting...");
        const peer = (net.peer = new Peer({ debug: 0 }));
        let retry = null;
        const dial = () => {
          if (net.peer !== peer || peer.destroyed) return;
          if (peer.disconnected) peer.reconnect();
          const conn = peer.connect(ROOM_PREFIX + room, { reliable: true });
          const lost = () => {
            if (net.peer !== peer) return;
            net.conns = net.conns.filter((c) => c !== conn);
            if (net.conns.length) return;
            netStatus("lost", "Connection lost. Trying again...");
            clearTimeout(retry);
            retry = setTimeout(dial, 3000);
          };
          conn.on("open", () => {
            conn.seen = Date.now();
            net.conns = [conn];
            netSend(conn, { t: "hello" });
          });
          conn.on("data", (msg) => {
            conn.seen = Date.now();
            if (!msg || net.peer !== peer) return;
            if (msg.t === "welcome") {
              net.seat = msg.seat;
              net.rev = msg.rev;
              netApply(msg.state);
              if (modal && modal.kind === "newgame") modal = null;
              netStatus("connected");
            } else if (msg.t === "state") {
              net.rev = msg.rev;
              netApply(msg.state, msg.by === peer.id);
              if (msg.rejected) toast("The other player moved first: the board was refreshed");
            }
          });
          conn.on("close", lost);
          conn.on("error", lost);
        };
        peer.on("open", dial);
        peer.on("error", (err) => {
          if (net.peer !== peer) return;
          if (err.type === "peer-unavailable") {
            netStatus("lost", "No room with that code is open right now. Trying again...");
            clearTimeout(retry);
            retry = setTimeout(dial, 4000);
          } else netStatus("error", "Network problem: " + err.type);
        });
        peer.on("disconnected", () => {
          if (net.peer === peer && !peer.destroyed)
            setTimeout(() => net.peer === peer && !peer.destroyed && peer.reconnect(), 3000);
        });
        netHeartbeat();
      }

      function netLabel() {
        const me = net.seat >= 0 ? state.players[net.seat].name : "watching";
        if (net.status === "connected") return net.role === "host" ? "Online · " + me : "Online · " + me;
        if (net.status === "waiting") return "Room " + net.room + " · waiting";
        if (net.status === "lost") return "Reconnecting...";
        if (net.status === "error") return "Online problem";
        return "Connecting...";
      }
      function renderOnlineModal() {
        const seatBtn = (i) =>
          '<button class="btn' +
          (modal.seat === i ? " on" : "") +
          '" data-act="netseat:' +
          i +
          '">' +
          esc(state.players[i].name) +
          "</button>";
        let h = "<h2>Play online</h2>";
        if (!online()) {
          h +=
            '<div class="mlabel">Start a room (you keep the game; the other player connects to you)</div>' +
            '<div class="row"><label>You play</label>' +
            seatBtn(0) +
            seatBtn(1) +
            "</div>" +
            '<div class="grid go" style="margin-top:8px"><button class="btn on" data-act="nethost">Host this game</button><span></span></div>' +
            '<div class="mlabel" style="margin-top:18px">Or join a room</div>' +
            '<div class="row"><input id="roomInput" placeholder="ROOM CODE" maxlength="12" style="text-transform:uppercase" value="' +
            esc(modal.room || "") +
            '">' +
            '<button class="btn on" data-act="netjoin">Join</button></div>' +
            '<div class="hint">Both players need this page open at the same time. The game lives in the host\'s browser; if the host closes the tab the session ends, and either player can host again from where it stopped.</div>' +
            '<div class="grid go"><span></span><button class="btn" data-act="modal-no">Close</button></div>';
        } else {
          const me =
            net.seat >= 0
              ? state.players[net.seat].name
              : "nobody (watching only: both commanders are taken)";
          h +=
            '<div class="mtext">' +
            (net.status === "connected"
              ? net.role === "host"
                ? "The other player is connected."
                : "Connected to the host."
              : net.status === "waiting"
                ? "Waiting for the other player to join."
                : esc(net.note || "Connecting...")) +
            "</div>" +
            '<div class="row"><label>You play</label><b>' +
            esc(me) +
            "</b></div>" +
            '<div class="row"><label>Room code</label><b style="color:var(--or);font-size:18px;letter-spacing:.2em">' +
            esc(net.room) +
            "</b></div>";
          if (net.role === "host")
            h +=
              '<div class="mlabel">Send this link to the other player</div>' +
              '<div class="row"><input id="roomLink" readonly value="' +
              esc(roomLink(net.room)) +
              '"><button class="btn" data-act="netcopy">Copy</button></div>';
          h +=
            '<div class="grid go"><button class="btn warn" data-act="netstop">' +
            (net.role === "host" ? "Close the room" : "Leave the room") +
            '</button><button class="btn" data-act="modal-no">Close</button></div>';
        }
        $("modalBox").innerHTML = h;
      }

      // The bonus shop for one commander.
      function renderShopModal() {

            );
          }).join("") +

      }

      // The battle card: everything both players need to start the right match, and the result buttons.
      function renderBattleModal() {
        const b = state.battle;
        if (!b) {
          modal = null;
          return renderModal();
        }
        const n = nodeById(b.node),
          m = b.map >= 0 ? n.maps[b.map] : null,
          eras = battleEras(b),
          mission = battleMission(b),
          status = missionStatus(mission),
          modeName =
            b.map < 0 ? "Space assault" : (MODES.find((x) => x[0] === battleMode(b)) || ["", b.mode])[1];
        const eraBtn = (e) =>
          '<button class="btn' +
          (b.era === e ? " on" : "") +
          '" data-act="bera:' +
          e +
          '"' +
          (eras.includes(e) ? "" : " disabled") +
          ">" +
          ERA_NAMES[e] +
          "</button>";
        const battleName = (node, mapIdx) =>
          node.name + (mapIdx >= 0 ? ": " + node.maps[mapIdx].name : " (space)");
        let h = "";
        const wn = modal.wanted && nodeById(modal.wanted.node);
        if (wn && (wn.kind !== "planet" || wn.maps[modal.wanted.map]))
          h +=
            '<div style="border:1px solid var(--or);padding:8px 10px;margin-bottom:12px"><b style="color:var(--or)">This is not ' +
            esc(battleName(wn, modal.wanted.map)) +

            esc(battleName(n, b.map)) +
            '</b>. Record who won it below, or drop it:<div class="grid" style="margin-top:8px"><button class="btn on" data-act="bswitch">Drop it and start ' +
            esc(battleName(wn, modal.wanted.map)) +
            "</button><span></span></div></div>";
        if (freeBattle(b))
          h +=
            '<div class="hint" style="min-height:0;margin:0 0 10px;color:var(--or)">Set up in edit mode: any era, mode and bonus can be chosen here, bought or not. Recording the result only uses up bonuses that were actually in hand.</div>';
        h +=
          "<h2>Battle · " +
          esc(n.name) +
          (m ? ": " + esc(m.name) : " (space)") +
          "</h2>" +
          '<div class="mlabel">Era' +
          (b.die ? " · rolled " + b.die : "") +
          (eras.length === 1 ? " · this map only has one" : "") +
          "</div>" +
          '<div class="grid3">' +
          eraBtn("c") +
          eraBtn("g") +
          '<button class="btn" data-act="era"' +
          (eras.length === 1 ? " disabled" : "") +
          ' title="Odd = Clone Wars, even = Galactic Civil War">Roll the die</button></div>';
        if (b.map < 0)
          h +=
            '<div class="row" style="margin-top:10px"><label>Space map</label><select data-f="bspace"' +
            (b.era ? "" : " disabled") +
            ">" +
            (b.era ? spaceMapsFor(b.era) : [])
              .map(
                (s) =>
                  '<option value="' +
                  s[0] +
                  '"' +
                  (b.space === s[0] ? " selected" : "") +
                  ">" +
                  s[1] +
                  "</option>",
              )
              .join("") +
            "</select></div>";
        else
          h +=
            '<div class="row" style="margin-top:10px"><label>Mode</label><select data-f="bmode">' +
            battleModes(b)
              .map(
                (x) =>
                  '<option value="' +
                  x[0] +
                  '"' +
                  (battleMode(b) === x[0] ? " selected" : "") +
                  ">" +
                  x[1] +
                  "</option>",
              )
              .join("") +
            "</select></div>";
        if (b.era) {
          h += '<div class="mlabel">Sides in the ' + ERA_NAMES[b.era] + "</div>";
          state.players.forEach((p, i) => {
            h +=
              '<div class="row"><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' +
              p.color +
              '"></span><b style="color:' +
              p.color +
              ';flex:0 0 90px;text-transform:uppercase">' +
              esc(p.name) +
              "</b><span>" +
              sideOf(i, b.era) +
              "</span>" +
              "</div>";
            // the bonuses this commander holds: click to field them in this battle
            const chipsHtml = BONUSES.filter((x) => p.bonuses[x[0]] > 0 || b.use[i][x[0]] || freeBattle(b))
              .map((x) => {
                const blocked = b.map < 0 && !x[3] && !freeBattle(b);
                return (
                  '<button class="chip b' +
                  (b.use[i][x[0]] ? " on" : "") +
                  '" style="--pc:' +
                  p.color +
                  '" data-act="buse:' +
                  i +
                  ":" +
                  x[0] +
                  '"' +
                  (blocked
                    ? ' disabled title="Does nothing in a space battle"'
                    : ' title="' + esc(x[2]) + '"') +
                  ">" +
                  x[1] +
                  (p.bonuses[x[0]] > 1 ? " ×" + p.bonuses[x[0]] : "") +
                  "</button>"
                );
              })
              .join("");
            h +=
              '<div class="row" style="flex-wrap:wrap;margin:-2px 0 8px 16px"><span style="color:var(--dim);font-size:10px;text-transform:uppercase">Bonuses</span>' +
              (chipsHtml || '<span style="color:var(--dim);font-size:11px">none in hand</span>') +
              "</div>";
          });
          h +=
            '<button class="btn" data-act="bswap" title="For a commander who has bought a faction pick">Swap sides</button>';
        }
        h +=
          '<div class="mlabel">Mission</div><div class="row"><span class="code"' +
          (status === "missing" ? ' style="color:#ff6a5a"' : "") +
          ">" +
          (mission || (b.era ? "no mission code set for this map" : "pick or roll the era first")) +
          "</span>" +
          (status === "missing"
            ? '<span style="color:#ff6a5a">is not in the scanned game. Starting it would load a different map.</span>'
            : status === "ok"
              ? '<span style="color:var(--dim)">found in the scanned game</span>'
              : "") +
          "</div>" +
          (state.missions
            ? ""
            : '<div class="hint" style="min-height:0;margin:0 0 6px">These modes are not checked against your game yet, and a mode the map does not have loads a different map. Run <b>install-launcher.bat -ScanMissions</b> once to load the real list.</div>') +
          '<div class="grid"><button class="btn on" data-act="launch"' +
          (mission && (status !== "missing" || freeBattle(b)) ? "" : " disabled") +
          ' title="Starts Battlefront II on this mission. Needs the launcher installed on this PC; you are offered it if it is missing.">Launch game</button>' +
          '<button class="btn" data-act="bcopy"' +
          (mission ? "" : " disabled") +
          ">Copy mission code</button></div>";
        if (b.era) {
          // one checklist line per commander who is fielding bonuses, in the Fake Console's own wording
          const fielded = state.players
            .map((p, i) => {
              const names = BONUSES.filter((x) => b.use[i][x[0]]).map((x) => "<b>Bonus # " + x[1] + "</b>");
              return names.length
                ? "<li>" +
                    esc(p.name) +
                    " (" +
                    sideOf(i, b.era) +
                    "): pause, open Fake Console, and use " +
                    names.join(", ") +
                    ".</li>"
                : "";
            })
            .join("");
          h +=
            '<div class="mlabel">In the game</div><ol>' +
            "<li>One player hosts <b>" +
            esc(
              m
                ? n.name + ": " + m.name
                : (spaceMapsFor(b.era).find((s) => s[0] === b.space) || ["", "the space map"])[1],
            ) +
            "</b>, " +
            ERA_NAMES[b.era] +
            ", " +
            modeName +
            "; the other joins.</li>" +
            "<li>At the spawn screen " +
            state.players.map((p, i) => esc(p.name) + " picks <b>" + sideOf(i, b.era) + "</b>").join(", ") +
            ".</li>" +
            fielded +
            (fielded ? "<li># is 1 or 2: the number of that faction's team on this map.</li>" : "") +
            "</ol>";
        }
        h +=
          '<div class="mlabel">Result</div><div class="grid">' +
          state.players
            .map(
              (p, i) =>
                '<button class="btn" style="border-color:' +
                p.color +
                ";color:" +
                p.color +
                '" data-act="bwin:' +
                i +
                '">' +
                esc(p.name) +
                " won</button>",
            )
            .join("") +
          '</div><div class="grid go"><button class="btn warn" data-act="bcancel">Cancel this battle</button><button class="btn" data-act="modal-no">Hide</button></div>';
        $("modalBox").innerHTML = h;
      }

      function renderModal() {
        $("modal").classList.toggle("show", !!modal);
        if (!modal) return;
        $("modalBox").classList.toggle("wide", modal.kind === "battle" || modal.kind === "shop");
        if (modal.kind === "online") return renderOnlineModal();
        if (modal.kind === "battle") return renderBattleModal();
        if (modal.kind === "shop") return renderShopModal();
        if (modal.kind === "launcher") return renderLauncherModal();
        if (modal.kind === "confirm") {
          $("modalBox").innerHTML =
            "<h2>Are you sure?</h2>" +
            '<div class="mtext">' +
            esc(modal.text) +
            "</div>" +
            '<div class="grid"><button class="btn on" data-act="modal-yes">Yes</button><button class="btn" data-act="modal-no">No</button></div>';
          return;
        }
        const opt = (key, val, label) =>
          '<button class="btn' +
          (String(modal[key]) === val ? " on" : "") +
          '" data-act="ng:' +
          key +
          ":" +
          val +
          '">' +
          esc(label) +
          "</button>";
        $("modalBox").innerHTML =
          "<h2>New game</h2>" +
          '<div class="mlabel">How planets are handed out</div><div class="grid">' +
          opt("mode", "random", "Random") +
          opt("mode", "draft", "Pick in turns") +
          '</div><div class="hint">' +
          (modal.mode === "draft"
            ? "Commanders take turns clicking an unclaimed planet until none are left. Planets have different numbers of maps, so they are not worth the same."
            : "Planets are dealt at random so both commanders get the same number of maps, not the same number of planets.") +
          '</div><div class="mlabel">Goes first</div><div class="grid3">' +
          opt("first", "0", state.players[0].name) +
          opt("first", "1", state.players[1].name) +
          opt("first", "random", "Random") +
          '</div><label class="row" style="margin-top:12px"><input type="checkbox" data-f="ngcap"' +
          (modal.capitals ? " checked" : "") +
          "> Give each commander a capital (always a single-map planet)</label>" +
          '<div class="hint">Everyone starts with ' +
          state.rules.startCredits +
          " credits. Ownership, fleets and the turn counter are cleared; the board layout stays.</div>" +
          '<div class="grid go"><button class="btn on" data-act="ng-start">Start</button><button class="btn" data-act="modal-no">Cancel</button></div>';
      }
      const openNewGame = () => {
        modal = { kind: "newgame", mode: "random", first: "random", capitals: true };
        renderModal();
      };

      function renderUI() {
        document.body.className = edit ? "edit" : "play";
        $("modeBtn").textContent = edit ? "Edit mode" : "Play mode";
        $("modeBtn").classList.toggle("on", edit);
        const p = state.players[state.current];
        const who =
          '<span class="dot" style="background:' +
          p.color +
          '"></span><b style="color:' +
          p.color +
          '">' +
          esc(p.name) +
          "</b>";
        $("turn").innerHTML =
          (state.phase === "draft"
            ? "Planet draft" + who + " picks a planet (" + state.nodes.filter(isUnclaimed).length + " left)"
            : "Turn <b>" + state.turn + "</b>" + who + " to move") +
          (placing !== null
            ? " &nbsp;·&nbsp; click a pulsing planet to deploy " +
              esc(state.players[placing].name) +
              "'s fleet"
            : "") +
          (state.era ? " &nbsp;·&nbsp; Era roll <b>" + state.era.die + "</b> " + esc(state.era.era) : "");
        document
          .querySelectorAll("#tools .btn")
          .forEach((b) => b.classList.toggle("on", b.dataset.act === "tool:" + tool));
        $("hint").textContent =
          HINTS[tool] + (tool === "lane" && laneStart ? " Now click the second node." : "");
        const codes = state.missions ? Object.keys(state.missions).sort() : [];
        $("codes").innerHTML = codes.map((c) => '<option value="' + c + '">').join("");
        $("missionInfo").textContent = codes.length
          ? "Mission list loaded: " +
            codes.length +
            " maps from a real game install. Battles only offer eras and modes that exist."
          : "No mission list loaded. Run install-launcher.bat -ScanMissions on a PC with the game to load it.";
        RULES.forEach((r) => {
          const i = $("rule-" + r[0]);
          if (document.activeElement !== i) i.value = state.rules[r[0]];
        });
        const battleKey = state.battle ? state.battle.node + ":" + state.battle.map : "";
        if (battleKey && battleKey !== shownBattle) modal = { kind: "battle" }; // a battle was just called, here or by the other player
        if (!battleKey && modal && modal.kind === "battle") modal = null;
        shownBattle = battleKey;
        $("battleBtn").hidden = !battleKey;
        if (battleKey) {
          const bn = nodeById(state.battle.node);
          $("battleBtn").textContent =
            "Battle: " + bn.name + (state.battle.map >= 0 ? " · " + bn.maps[state.battle.map].name : "");
        }
        $("netBtn").textContent = online() ? netLabel() : "Play online";
        $("netBtn").classList.toggle("on", net.status === "connected");
        $("netBtn").classList.toggle("warn", net.status === "lost" || net.status === "error");
        renderSelection();
        renderPlayers();
        renderModal();
        $("log").classList.toggle("open", logOpen);
        $("logBody").innerHTML = state.log.map((l) => "<div>" + esc(l) + "</div>").join("");
        document.querySelector("#logTab .last").textContent = logOpen ? "" : state.log[0] || "";
        document.querySelector("#logTab .arrow").textContent = logOpen ? "▼" : "▲";
      }

      $("rules").innerHTML = RULES.map(
        (r) =>
          '<div class="row"><label style="flex-basis:150px">' +
          r[1] +
          '</label><input type="number" min="0" step="50" id="rule-' +
          r[0] +
          '" data-f="rule" data-i="' +
          r[0] +
          '"></div>',
      ).join("");

      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (!b) return;
        const [act, a, c] = b.dataset.act.split(":");
        const n = sel && sel.kind === "node" ? nodeById(sel.id) : null;
        switch (act) {
          case "tool":
            tool = a;
            laneStart = null;
            commit();
            break;
          case "mode":
            placing = null;
            edit = !edit;
            tool = "select";
            laneStart = null;
            commit();
            break;
          case "card":
            cardOverride[+a] = !cardIsOpen(+a);
            renderPlayers();
            break;
          case "logtoggle":
            logOpen = !logOpen;
            renderUI();
            break;
          case "undo":
            undo();
            break;
          case "endturn":
            endTurn();
            break;
          case "era":
            rollEra();
            break;
          case "buy":
            buy(+a, c);
            break;
          case "cred":
            mutate(() => {
              state.players[+a].credits = Math.max(0, state.players[+a].credits + +c);
            });
            break;
          case "own":
            if (n)
              mutate(() => {
                n.maps[+a].owner = +c;
              });
            break;
          case "battleopen":
            if (n) startBattle(n, +a);
            break;
          case "shop":
            modal = { kind: "shop", pi: +a };
            renderModal();
            break;
          case "buybonus":
            buyBonus(+a, c);
            break;
          case "buse":
            if (online() && !edit && !mySeat(+a)) toast("You are not playing " + state.players[+a].name);
            else
              mutate(() => {
                markFree();
                const use = state.battle.use[+a];
                if (use[c]) delete use[c];
                else use[c] = true;
              });
            break;
          case "battleshow":
            modal = { kind: "battle" };
            renderModal();
            break;
          case "bera":
            mutate(() => {
              markFree();
              setBattleEra(state.battle, a, 0);
            });
            break;
          case "bswap":
            mutate(() => {
              const e = state.battle.era;
              state.sides[e] = 1 - state.sides[e];
              log(
                "Sides swapped for the " +
                  ERA_NAMES[e] +
                  ": " +
                  state.players.map((p, i) => p.name + " " + sideOf(i, e)).join(", "),
              );
            });
            break;
          case "bwin":
            if (state.battle) battle(nodeById(state.battle.node), state.battle.map, +a);
            break;
          case "bswitch": {
            const want = modal.wanted,
              wantNode = want && nodeById(want.node);
            mutate(() => {
              log("Battle at " + nodeById(state.battle.node).name + " dropped");
              state.battle = null;
            });
            if (wantNode) startBattle(wantNode, want.map);
            break;
          }
          case "bcancel":
            mutate(() => {
              log("Battle at " + nodeById(state.battle.node).name + " cancelled");
              state.battle = null;
            });
            break;
          case "launch":
            launchGame(battleMission(state.battle));
            break;
          case "launchretry": {
            const mission = modal.mission;
            modal = state.battle ? { kind: "battle" } : null;
            renderModal();
            launchGame(mission);
            break;
          }
          case "launcherok":
            localStorage.setItem(LAUNCHER_FLAG, "1");
            modal = state.battle ? { kind: "battle" } : null;
            renderModal();
            break;
          case "launcherback":
            modal = state.battle ? { kind: "battle" } : null;
            renderModal();
            break;
          case "launcherhelp":
            modal = { kind: "launcher", mission: battleMission(state.battle) };
            renderModal();
            break;
          case "bcopy":
            if (navigator.clipboard)
              navigator.clipboard
                .writeText(battleMission(state.battle))
                .then(() => toast("Mission code copied"));
            break;
          case "addmap":
            if (n)
              mutate(() => {
                n.maps.push({ name: "Map " + (n.maps.length + 1), owner: -1 });
                if (!canBeCapital(n)) n.capital = false;
              });
            break;
          case "delmap":
            if (n) mutate(() => n.maps.splice(+a, 1));
            break;
          case "delsel":
            if (sel) deleteThing(sel);
            break;
          case "selfleet":
            sel = { kind: "fleet", id: a };
            commit();
            break;
          case "delfleet":
            deleteThing({ kind: "fleet", id: a });
            break;
          case "export": {
            const u = URL.createObjectURL(
              new Blob([JSON.stringify(state, null, 1)], { type: "application/json" }),
            );
            const l = document.createElement("a");
            l.href = u;
            l.download = "seanquest-turn" + state.turn + ".json";
            l.click();
            setTimeout(() => URL.revokeObjectURL(u), 1000);
            break;
          }
          case "import":
            $("file").click();
            break;
          case "newgame":
            openNewGame();
            break;
          case "online":
            modal = { kind: "online", seat: state.current, room: "" };
            renderModal();
            break;
          case "netseat":
            modal.seat = +a;
            renderModal();
            break;
          case "nethost":
            netHost(modal.seat);
            break;
          case "netjoin":
            netJoin($("roomInput").value);
            break;
          case "netstop":
            netStop();
            break;
          case "netcopy":
            $("roomLink").select();
            if (navigator.clipboard)
              navigator.clipboard.writeText($("roomLink").value).then(() => toast("Link copied"));
            else document.execCommand("copy");
            break;
          case "ng":
            modal[a] = c;
            renderModal();
            break;
          case "ng-start": {
            const o = modal;
            modal = null;
            startNewGame(o);
            break;
          }
          case "modal-yes": {
            const yes = modal.onYes;
            modal = null;
            yes();
            break;
          }
          case "modal-no":
            modal = null;
            renderModal();
            break;
          case "reset":
            if (confirm("Restore the default board? This discards every edit."))
              mutate(() => {
                state = defaultState();
                sel = null;
              });
            break;
        }
      });

      document.addEventListener("change", (e) => {
        const t = e.target,
          f = t.dataset.f;
        if (!f) return;
        if (f === "ngcap") {
          modal.capitals = t.checked;
          return;
        }
        const i = t.dataset.i,
          n = sel && sel.kind === "node" ? nodeById(sel.id) : null;
        mutate(() => {
          if (f === "name" && n) n.name = t.value;
          else if (f === "type" && n) n.type = t.value;
          else if (f === "size" && n) n.size = +t.value;
          else if (f === "ring" && n) n.ring = t.checked;
          else if (f === "capital" && n) n.capital = t.checked && canBeCapital(n);
          else if (f === "map" && n) n.maps[+i].name = t.value;
          else if (f === "mapcode" && n) {
            n.maps[+i].code = t.value;
            fillMapCode(n.name, n.maps[+i]);
          } else if (f === "maperas" && n) n.maps[+i].eras = t.value;
          else if (f === "bmode" && state.battle) {
            markFree();
            state.battle.mode = t.value;
          } else if (f === "bspace" && state.battle) {
            markFree();
            state.battle.space = t.value;
          } else if (f === "value") {
            const l = state.lanes.find((x) => x.id === sel.id);
            if (l) l.value = +t.value || 0;
          } else if (f === "fleetnode") {
            const fl = state.fleets.find((x) => x.id === sel.id);
            if (fl) {
              fl.node = t.value;
              fleetPos.delete(fl.id);
            }
          } else if (f === "pname") state.players[+i].name = t.value || "Player " + (+i + 1);
          else if (f === "pcolor") state.players[+i].color = t.value;
          else if (f === "pcredits") state.players[+i].credits = Math.max(0, Math.round(+t.value) || 0);
          else if (f === "rule") state.rules[i] = Math.max(0, +t.value || 0);
        });
      });

      $("file").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const rd = new FileReader();
        rd.onload = () => {
          try {
            const s = normalize(JSON.parse(rd.result));
            mutate(() => {
              state = s;
              sel = null;
            });
            toast("Board loaded");
          } catch (err) {
            toast("Could not load: " + err.message);
          }
        };
        rd.readAsText(file);
        e.target.value = "";
      });

      addEventListener("keydown", (e) => {
        if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
          e.preventDefault();
          undo();
        } else if (e.key === "Escape") {
          placing = null;
          modal = null;
          sel = null;
          laneStart = null;
          tool = "select";
          commit();
        } else if ((e.key === "Delete" || e.key === "Backspace") && edit && sel) deleteThing(sel);
      });

      resize();
      syncScene();
      // The installer's scan opens this page with the mission list in the address. It is kept under its
      // own storage key as well, so a board already open in another tab picks it up and, if that
      // board is online, passes it to the other player.
      function adoptMissions(packed, announce) {
        const list = packed && cleanMissions(packed.list);
        if (!list || (state.missionsAt || 0) >= packed.at) return false;
        const apply = () => {
          state.missions = list;
          state.missionsAt = packed.at;
          log("Mission list loaded from a game install: " + Object.keys(list).length + " maps");
        };
        if (announce) {
          mutate(apply);
          toast("Mission list loaded: " + Object.keys(list).length + " maps");
        } else {
          apply();
          save();
        }
        return true;
      }
      const hashList = /^#missions=(.+)$/.exec(location.hash);
      if (hashList) {
        const list = parseMissionList(decodeURIComponent(hashList[1]));
        history.replaceState(null, "", location.pathname + location.search);
        if (list) localStorage.setItem(MISSIONS_KEY, JSON.stringify({ at: Date.now(), list }));
      }
      const readStoredMissions = () => {
        try {
          return JSON.parse(localStorage.getItem(MISSIONS_KEY));
        } catch (e) {
          return null;
        }
      };
      const loadedList = adoptMissions(readStoredMissions(), false);
      addEventListener("storage", (e) => {
        if (e.key === MISSIONS_KEY) adoptMissions(readStoredMissions(), true);
      });
      // A link with ?room=CODE joins that room; a host that reloads reopens its room.
      const joinRoom = new URLSearchParams(location.search).get("room");
      let hosted = null;
      try {
        hosted = JSON.parse(sessionStorage.getItem("gzsq-host"));
      } catch (e) {}
      if (joinRoom) {
        modal = { kind: "online", seat: 0, room: joinRoom };
        netJoin(joinRoom);
      } else if (hosted && hosted.room) netHost(hosted.seat === 1 ? 1 : 0, hosted.room);
      else if (fresh && !hashList) openNewGame();
      renderUI();
      if (hashList)
        toast(
          loadedList
            ? "Mission list loaded: " + Object.keys(state.missions).length + " maps"
            : "That mission list could not be read",
        );
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
